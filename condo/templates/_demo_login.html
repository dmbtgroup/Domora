{# Demo sign-in: pick a role, no password to type. #}
{% from "_macros.html" import csrf %}
<form method="post" action="{{ url_for('auth.demo_sign_in') }}" class="demo-pick">
  {{ csrf() }}
  <label>{% trans %}Sign in as{% endtrans %}
    <select name="role">
      <option value="president">{{ _('Board president') }} · Sophie Lavoie</option>
      <option value="treasurer">{{ _('Owner and treasurer') }} · Marc Gagnon</option>
      <option value="owner" selected>{{ _('Owner') }} · Isabelle Côté</option>
      <option value="tenant">{{ _('Tenant') }} · Thomas Pelletier</option>
    </select></label>
  <button class="btn primary full">{% trans %}Go{% endtrans %}</button>
  <p class="muted small">{% trans %}No password needed in the demo.{% endtrans %}</p>
</form>
