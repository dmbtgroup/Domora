<!doctype html>
<html lang="en" data-title-en="{{ title_en }} · Belcentra" data-title-fr="{{ title_fr }} · Belcentra">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ title_en }} · Belcentra</title>
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="stylesheet" href="/site.css">
</head>
<body>
<div class="wrap">
  <header>
    <a class="brand" href="/"><img src="/logo.png" alt=""><span><strong>BELCENTRA</strong></span></a>
    <nav class="nav">
    <a class="navlink" href="/pricing"><span data-en>Pricing</span><span data-fr>Tarifs</span></a>
    <a class="navlink" href="/sign-in"><span data-en>Sign in</span><span data-fr>Connexion</span></a>
    <div class="lang" role="group" aria-label="Language / Langue">
      <button type="button" data-lang="en" aria-pressed="true">EN</button><button type="button" data-lang="fr" aria-pressed="false">FR</button>
    </div>
    </nav>
  </header>
  <article class="legal" data-fr>{% include "legal/" ~ doc ~ "_fr.html" %}</article>
  <article class="legal" data-en>{% include "legal/" ~ doc ~ "_en.html" %}</article>
  {% include "_footer.html" %}
</div>
<script src="/site.js"></script>
</body>
</html>
