<!doctype html>
<html lang="en" data-title-en="{% block title_en %}Sign in{% endblock %} · Belcentra" data-title-fr="{% block title_fr %}Connexion{% endblock %} · Belcentra">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>{{ self.title_en() }} · Belcentra</title>
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="stylesheet" href="/site.css">
</head>
<body>
<div class="wrap screen">
  <header>
    <a class="brand" href="/"><img src="/logo.png" alt=""><span><strong>BELCENTRA</strong></span></a>
    <nav class="nav">
      <a class="navlink" href="/pricing">{{ t("Pricing", "Tarifs") }}</a>
      <div class="lang" role="group" aria-label="Language / Langue">
        <button type="button" data-lang="en" aria-pressed="true">EN</button><button type="button" data-lang="fr" aria-pressed="false">FR</button>
      </div>
    </nav>
  </header>
  <div class="center">
    <div class="card box">
      {% for cat, msg in get_flashed_messages(with_categories=true) %}<p class="msg msg-{{ cat }}">{{ msg }}</p>{% endfor %}
      {% block box %}{% endblock %}
    </div>
  </div>
</div>
<script src="/site.js"></script>
<script>window.addEventListener("pageshow", function (e) { if (e.persisted) location.reload(); });</script>
</body>
</html>
